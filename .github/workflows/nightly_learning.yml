name: Nightly Learning

on:
  schedule:
    # 23:30 UTC — after Overnight Sentinel (23:00) so both don't race on state/
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

# Serialize all state/ writers (shadow, sentinel, learn, daily)
concurrency:
  group: tradingbrain-state
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Grade outcomes + forensics
        run: |
          python -m learning.outcome_grader

      - name: Mine patterns + audit rules
        run: |
          python -m learning.rule_ledger

      - name: Compute calibration
        run: |
          python -m learning.calibration

      # Persist learning even if git push fails later (lost forensics/calibration
      # was the historical failure mode when commit raced a dirty tree).
      - name: Upload learning artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-state-${{ github.run_id }}
          path: |
            state/forensics/
            state/calibration/
            state/rules/
            state/shadow/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit learning state
        run: |
          bash .github/scripts/commit_state.sh "learn: nightly $(date -u +%Y-%m-%d)"
