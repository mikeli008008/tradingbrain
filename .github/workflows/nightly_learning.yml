name: Nightly Learning

on:
  schedule:
    # 23:30 UTC — after Overnight Sentinel (23:00) so both don't race on state/
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

jobs:
  learn:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Grade outcomes + forensics
        run: |
          python -m learning.outcome_grader

      - name: Mine patterns + audit rules
        run: |
          python -m learning.rule_ledger

      - name: Compute calibration
        run: |
          python -m learning.calibration

      - name: Commit learning state
        run: |
          set -euo pipefail
          git config user.name "trading-brain"
          git config user.email "bot@users.noreply.github.com"
          # Learning scripts dirty state/ before this step. Commit first, then rebase.
          git add state/
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "learn: nightly $(date -u +%Y-%m-%d)"
          else
            echo "No learning state changes to commit"
            exit 0
          fi
          git pull --rebase origin main
          git push origin HEAD:main
